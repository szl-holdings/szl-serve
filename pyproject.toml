[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-serve"
version = "0.1.0"
description = "SZL historical Khipu pins, offline proposal validation, read-only qualification, and migration to authenticated A11oy Atelier."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Stephen P. Lutar Jr." },
  { name = "SZL Holdings" },
]
keywords = [
  "governed-inference",
  "llama.cpp",
  "ollama",
  "gguf",
  "receipts",
  "energy",
  "szl-holdings",
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "jsonschema>=4.26.0",
]

[project.optional-dependencies]
energy = ["szl-energy-attest>=0.3.4"]
gpu = ["pynvml>=13.0.1"]
sign = ["szl-receipt-dsse>=0.3.4"]
test = ["pytest", "setuptools>=84.2.1", "wheel"]

[project.urls]
Homepage = "https://a-11-oy.com"
Repository = "https://github.com/szl-holdings/szl-serve"
"Hugging Face GGUF" = "https://huggingface.co/SZLHOLDINGS/SZL-Khipu-1.5B-GGUF"
"Historical CPU lab (metadata only; legacy chat retired)" = "https://szlholdings-szl-model-inference-lab.hf.space"
"Space card" = "https://huggingface.co/spaces/SZLHOLDINGS/szl-model-inference-lab"
Issues = "https://github.com/szl-holdings/szl-serve/issues"
Changelog = "https://github.com/szl-holdings/szl-serve/releases"

[project.scripts]
szl-serve = "szl_serve.cli:main"

[tool.setuptools]
packages = ["szl_serve", "szl_serve.schemas"]

[tool.setuptools.package-dir]
"szl_serve.schemas" = "schemas"

[tool.setuptools.package-data]
szl_serve = ["py.typed"]
"szl_serve.schemas" = ["khipu.schema.json", "PIN.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "deploy/modelhost"]
addopts = "-q"

[tool.szl.release]
import_names = ["szl_serve"] # wheel top-level import names; the release gate fails if the built wheel differs
